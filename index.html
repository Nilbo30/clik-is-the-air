<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clik is the Air</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div class="hud-item"><div class="hud-label">Level</div><div class="hud-value level" id="h-level">1</div></div>
  <div class="hud-item"><div class="hud-label">Wave</div><div class="hud-value wave" id="h-wave">1</div></div>
  <div class="hud-item"><div class="hud-label">Damage</div><div class="hud-value dmg" id="h-dmg">1</div></div>
  <div class="hud-item"><div class="hud-label">Cost</div><div class="hud-value cost" id="h-cost">1</div></div>
  <div class="hud-item"><div class="hud-label">Cooldown</div><div class="hud-value cd" id="h-cd">1.0s</div></div>
  <div class="hud-item hud-dp-item">
    <div class="hud-label">Death Points</div>
    <div class="hud-value dp" id="h-dp">0</div>
    <button id="prestige-btn" class="prestige-hud-btn">Upgrades</button>
  </div>
</div>

<!-- Main arena -->
<div id="arena">
  <!-- XP bar -->
  <div class="bar-wrap">
    <div class="bar-label">XP</div>
    <div class="bar"><div class="bar-fill xp" id="xp-fill" style="width:0%"></div><div class="bar-text" id="xp-text">0 / 100</div></div>
  </div>

  <!-- Enemy HP bar -->
  <div class="bar-wrap">
    <div class="bar-label">Enemy HP</div>
    <div class="bar"><div class="bar-fill hp" id="hp-fill" style="width:100%"></div><div class="bar-text" id="hp-text">250 / 250</div></div>
  </div>

  <!-- Enemy button -->
  <div class="enemy-wrap">
    <svg id="cooldown-ring" viewBox="0 0 192 192"><circle cx="96" cy="96" r="90"/></svg>
    <button id="enemy-btn">FIGHT</button>
  </div>

  <!-- Energy bar -->
  <div class="bar-wrap" style="margin-top: 16px;">
    <div class="bar-label">Energy</div>
    <div class="bar"><div class="bar-fill energy" id="en-fill" style="width:100%"></div><div class="bar-text" id="en-text">50 / 50</div></div>
  </div>
</div>

<!-- Level-up modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2>Level Up!</h2>
    <p id="modal-level">Choose a skill</p>
    <div id="skill-choices"></div>
  </div>
</div>

<div id="guarantee-badge"></div>
<div id="debug-badge">DEBUG</div>

<!-- Game over -->
<div id="gameover-overlay">
  <h1>GAME OVER</h1>
  <div class="go-stats" id="go-stats">You ran out of energy!</div>
  <div class="go-dp-summary">
    <div class="go-dp-row">Enemies killed: <span id="go-kills">0</span></div>
    <div class="go-dp-row">DP earned: <span id="go-dp-earned" class="dp-highlight">+0</span></div>
    <div class="go-dp-row">Total DP: <span id="go-dp-total">0</span></div>
  </div>
  <div class="go-buttons">
    <button id="restart-btn">Play Again</button>
    <button id="go-prestige-btn" class="prestige-go-btn">Upgrades</button>
  </div>
</div>

<!-- Prestige screen -->
<div id="prestige-overlay">
  <div id="prestige-screen">
    <div class="pt-header">
      <h2>Prestige Upgrades</h2>
      <div class="pt-dp-display">Death Points: <span id="pt-dp">0</span></div>
    </div>
    <div class="pt-branches">
      <div class="pt-branch">
        <h3 class="pt-branch-title">Stats</h3>
        <div id="prestige-nodes" class="pt-nodes"></div>
      </div>
    </div>
    <button id="prestige-back" class="pt-back-btn">Back to Game</button>
    <button id="prestige-start" class="pt-start-btn">Start Run</button>
  </div>
</div>

<!-- Scripts: order matters (ui → skills → prestige → game → debug) -->
<script src="ui.js"></script>
<script src="skills.js"></script>
<script src="prestige.js"></script>
<script src="game.js"></script>
<script src="debug.js"></script>
<script>
  // Bootstrap
  UI.initDom();
  Game.init();
  UI.startCooldownLoop();
  Debug.init();
</script>
</body>
</html>
