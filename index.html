<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clik is the Air</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  /* --- Top HUD --- */
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 18px 24px;
    background: rgba(15, 15, 26, .85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #1e1e3a;
    z-index: 10;
  }
  .hud-item { text-align: center; min-width: 100px; }
  .hud-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #888; margin-bottom: 4px; }
  .hud-value { font-size: 22px; font-weight: 700; }
  .hud-value.level { color: #a78bfa; }
  .hud-value.wave  { color: #f59e0b; }
  .hud-value.dmg   { color: #ef4444; }
  .hud-value.cost  { color: #38bdf8; }
  .hud-value.cd    { color: #34d399; }

  /* --- Bars --- */
  .bar-wrap {
    width: 340px;
    max-width: 90vw;
    margin-bottom: 14px;
    text-align: center;
  }
  .bar-label {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
    color: #aaa;
  }
  .bar {
    height: 22px;
    border-radius: 11px;
    background: #1a1a2e;
    overflow: hidden;
    position: relative;
    border: 1px solid #2a2a4a;
  }
  .bar-fill {
    height: 100%;
    border-radius: 11px;
    transition: width .15s ease;
  }
  .bar-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .bar-fill.hp     { background: linear-gradient(90deg, #dc2626, #ef4444); }
  .bar-fill.energy { background: linear-gradient(90deg, #2563eb, #38bdf8); }
  .bar-fill.xp     { background: linear-gradient(90deg, #7c3aed, #a78bfa); }

  /* --- Enemy area --- */
  #arena {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .enemy-wrap {
    position: relative;
    width: 192px;
    height: 192px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #cooldown-ring {
    position: absolute;
    inset: 0;
    width: 192px;
    height: 192px;
    transform: rotate(-90deg);
    pointer-events: none;
    z-index: 2;
  }
  #cooldown-ring circle {
    fill: none;
    stroke: rgba(239,68,68,.35);
    stroke-width: 4;
    stroke-dasharray: 565.48;  /* 2 * PI * 90 */
    stroke-dashoffset: 565.48;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.05s linear;
  }
  #enemy-btn {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid #ef4444;
    background: radial-gradient(circle at 35% 35%, #2a1a1a, #1a0a0a);
    color: #ef4444;
    font-size: 28px;
    font-weight: 800;
    cursor: pointer;
    transition: box-shadow .1s, transform .1s;
    box-shadow: 0 0 30px rgba(239,68,68,.25), inset 0 0 20px rgba(239,68,68,.1);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  #enemy-btn.on-cooldown {
    opacity: .55;
    cursor: not-allowed;
  }
  #enemy-btn:hover {
    box-shadow: 0 0 50px rgba(239,68,68,.4), inset 0 0 30px rgba(239,68,68,.15);
  }
  #enemy-btn:active {
    transform: scale(.95);
  }
  #enemy-btn.shake {
    animation: shake .15s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translate(0); }
    25%  { transform: translate(-6px, 3px); }
    50%  { transform: translate(5px, -4px); }
    75%  { transform: translate(-3px, 5px); }
  }

  /* floating damage numbers */
  .dmg-float {
    position: absolute;
    font-size: 22px;
    font-weight: 800;
    color: #fbbf24;
    pointer-events: none;
    animation: floatUp .7s ease-out forwards;
    text-shadow: 0 0 6px rgba(251,191,36,.6);
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.4); }
  }

  /* --- Modal --- */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }

  #modal {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 16px;
    padding: 32px;
    max-width: 460px;
    width: 90vw;
    text-align: center;
  }
  #modal h2 {
    font-size: 24px;
    margin-bottom: 6px;
    color: #a78bfa;
  }
  #modal p {
    font-size: 14px;
    color: #888;
    margin-bottom: 24px;
  }
  .skill-btn {
    display: block;
    width: 100%;
    padding: 14px 18px;
    margin-bottom: 10px;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    background: #12121f;
    color: #e0e0e0;
    font-size: 15px;
    cursor: pointer;
    text-align: left;
    transition: background .15s, border-color .15s;
    position: relative;
    overflow: hidden;
  }
  .skill-btn:hover {
    background: #1e1e3a;
    border-color: #a78bfa;
  }
  .skill-btn .skill-name {
    font-weight: 700;
  }
  .skill-btn .skill-desc {
    display: block;
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }
  .skill-btn .skill-rarity {
    float: right;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* Rarity colors */
  .rarity-common .skill-name  { color: #9ca3af; }
  .rarity-common .skill-rarity { color: #9ca3af; }
  .rarity-common { border-color: #374151; }
  .rarity-common:hover { border-color: #6b7280; }

  .rarity-rare .skill-name  { color: #60a5fa; }
  .rarity-rare .skill-rarity { color: #60a5fa; }
  .rarity-rare { border-color: #1e3a5f; }
  .rarity-rare:hover { border-color: #60a5fa; }

  .rarity-epic .skill-name  { color: #c084fc; }
  .rarity-epic .skill-rarity { color: #c084fc; }
  .rarity-epic { border-color: #3b1f6e; }
  .rarity-epic:hover { border-color: #c084fc; }

  .rarity-legendary .skill-name  { color: #fbbf24; }
  .rarity-legendary .skill-rarity { color: #fbbf24; }
  .rarity-legendary { border-color: #78350f; }
  .rarity-legendary:hover { border-color: #fbbf24; }

  /* Epic purple shimmer */
  .rarity-epic::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 30%, rgba(192,132,252,.08) 45%, rgba(192,132,252,.15) 50%, rgba(192,132,252,.08) 55%, transparent 70%);
    background-size: 250% 100%;
    animation: shimmer 2.5s ease-in-out infinite;
    pointer-events: none;
  }

  /* Legendary gold glow */
  .rarity-legendary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 25%, rgba(251,191,36,.1) 40%, rgba(251,191,36,.25) 50%, rgba(251,191,36,.1) 60%, transparent 75%);
    background-size: 250% 100%;
    animation: shimmer 2s ease-in-out infinite;
    pointer-events: none;
  }
  .rarity-legendary {
    box-shadow: 0 0 12px rgba(251,191,36,.2), inset 0 0 12px rgba(251,191,36,.05);
  }

  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -50% 0; }
  }

  /* --- Game Over overlay --- */
  #gameover-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    backdrop-filter: blur(6px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #gameover-overlay.open { display: flex; }
  #gameover-overlay h1 {
    font-size: 48px;
    color: #ef4444;
    margin-bottom: 12px;
  }
  #gameover-overlay .go-stats {
    color: #888;
    font-size: 16px;
    margin-bottom: 24px;
  }
  #restart-btn {
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 700;
    border: 2px solid #a78bfa;
    border-radius: 10px;
    background: transparent;
    color: #a78bfa;
    cursor: pointer;
    transition: background .15s;
  }
  #restart-btn:hover { background: rgba(167,139,250,.15); }

  /* Debug indicator */
  #debug-badge {
    display: none;
    position: fixed;
    top: 72px;
    right: 18px;
    background: #dc2626;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 6px;
    z-index: 300;
  }
  #debug-badge.on { display: block; }

  /* Guarantee indicator */
  #guarantee-badge {
    display: none;
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 15, 26, .9);
    border: 1px solid #2a2a4a;
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 300;
    text-align: center;
    white-space: nowrap;
  }
  #guarantee-badge.on { display: block; }
  #guarantee-badge.g-rare      { color: #60a5fa; border-color: #1e3a5f; }
  #guarantee-badge.g-epic      { color: #c084fc; border-color: #3b1f6e; }
  #guarantee-badge.g-legendary { color: #fbbf24; border-color: #78350f; }
  #guarantee-badge.g-all-legendary { color: #fbbf24; border-color: #78350f; text-shadow: 0 0 8px rgba(251,191,36,.4); }
</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div class="hud-item"><div class="hud-label">Level</div><div class="hud-value level" id="h-level">1</div></div>
  <div class="hud-item"><div class="hud-label">Wave</div><div class="hud-value wave" id="h-wave">1</div></div>
  <div class="hud-item"><div class="hud-label">Damage</div><div class="hud-value dmg" id="h-dmg">1</div></div>
  <div class="hud-item"><div class="hud-label">Cost</div><div class="hud-value cost" id="h-cost">1</div></div>
  <div class="hud-item"><div class="hud-label">Cooldown</div><div class="hud-value cd" id="h-cd">1.0s</div></div>
</div>

<!-- Main arena -->
<div id="arena">
  <!-- XP bar -->
  <div class="bar-wrap">
    <div class="bar-label">XP</div>
    <div class="bar"><div class="bar-fill xp" id="xp-fill" style="width:0%"></div><div class="bar-text" id="xp-text">0 / 100</div></div>
  </div>

  <!-- Enemy HP bar -->
  <div class="bar-wrap">
    <div class="bar-label">Enemy HP</div>
    <div class="bar"><div class="bar-fill hp" id="hp-fill" style="width:100%"></div><div class="bar-text" id="hp-text">100 / 100</div></div>
  </div>

  <!-- Enemy button -->
  <div class="enemy-wrap">
    <svg id="cooldown-ring" viewBox="0 0 192 192"><circle cx="96" cy="96" r="90"/></svg>
    <button id="enemy-btn">FIGHT</button>
  </div>

  <!-- Energy bar -->
  <div class="bar-wrap" style="margin-top: 16px;">
    <div class="bar-label">Energy</div>
    <div class="bar"><div class="bar-fill energy" id="en-fill" style="width:100%"></div><div class="bar-text" id="en-text">50 / 50</div></div>
  </div>
</div>

<!-- Level-up modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2>Level Up!</h2>
    <p id="modal-level">Choose a skill</p>
    <div id="skill-choices"></div>
  </div>
</div>

<div id="guarantee-badge"></div>
<div id="debug-badge">DEBUG</div>

<!-- Game over -->
<div id="gameover-overlay">
  <h1>GAME OVER</h1>
  <div class="go-stats" id="go-stats">You ran out of energy!</div>
  <button id="restart-btn">Play Again</button>
</div>

<script>
  // --- Rarity system ---
  const RARITIES = [
    { id: 'common',    name: 'Common',    mult: 1,   weight: 60 },
    { id: 'rare',      name: 'Rare',      mult: 1.5, weight: 25 },
    { id: 'epic',      name: 'Epic',      mult: 2,   weight: 12 },
    { id: 'legendary', name: 'Legendary', mult: 3,   weight: 3  },
  ];
  const TOTAL_WEIGHT = RARITIES.reduce((s, r) => s + r.weight, 0);

  function rollRarity(minRarityIndex = 0) {
    // Roll base rarity from weights
    let roll = Math.random() * TOTAL_WEIGHT;
    let result = RARITIES[0];
    for (const r of RARITIES) {
      roll -= r.weight;
      if (roll <= 0) { result = r; break; }
    }
    let idx = RARITIES.indexOf(result);

    // Lucky bonus: chance to upgrade to next rarity tier
    if (state && state.luckyBonus > 0 && idx < RARITIES.length - 1) {
      if (Math.random() * 100 < state.luckyBonus) {
        idx++;
      }
    }

    // Enforce minimum rarity
    if (idx < minRarityIndex) idx = minRarityIndex;

    return RARITIES[idx];
  }

  // --- Skills pool ---
  const SKILLS = [
    {
      id: 'heavy', name: 'Heavy Strike', base: 2,
      desc: (v) => '+' + v + ' damage per click',
      apply: (s, v) => { s.dmg += v; },
    },
    {
      id: 'efficient', name: 'Efficient', base: 1,
      desc: (v) => '-' + v + ' energy cost (min 1)',
      apply: (s, v) => { s.cost = Math.max(1, s.cost - v); },
    },
    {
      id: 'berserker', name: 'Berserker', baseDmg: 5, baseCost: 2,
      desc: (v, r) => '+' + Math.floor(5 * r.mult) + ' damage, +' + Math.floor(2 * r.mult) + ' energy cost',
      apply: (s, v, r) => { s.dmg += Math.floor(5 * r.mult); s.cost += Math.floor(2 * r.mult); },
    },
    {
      id: 'focus', name: 'Focus', base: 20,
      desc: (v) => '+' + v + ' max energy',
      apply: (s, v) => { s.maxEnergy += v; s.energy = Math.min(s.energy + v, s.maxEnergy); },
    },
    {
      id: 'quickhands', name: 'Quick Hands', base: 0,
      desc: (v, r) => {
        const vals = { common: 0.1, rare: 0.15, epic: 0.25, legendary: 0.4 };
        return '-' + vals[r.id] + 's cooldown';
      },
      apply: (s, v, r) => {
        const vals = { common: 0.1, rare: 0.15, epic: 0.25, legendary: 0.4 };
        s.cooldown = Math.max(0.2, Math.min(3, s.cooldown - vals[r.id]));
      },
    },
    {
      id: 'slowdeadly', name: 'Slow but Deadly', base: 0,
      desc: (v, r) => {
        const cd = { common: 0.3, rare: 0.4, epic: 0.5, legendary: 0.8 };
        const dm = { common: 3, rare: 6, epic: 12, legendary: 25 };
        return '+' + cd[r.id] + 's cooldown, +' + dm[r.id] + ' damage';
      },
      apply: (s, v, r) => {
        const cd = { common: 0.3, rare: 0.4, epic: 0.5, legendary: 0.8 };
        const dm = { common: 3, rare: 6, epic: 12, legendary: 25 };
        s.cooldown = Math.max(0.2, Math.min(3, s.cooldown + cd[r.id]));
        s.dmg += dm[r.id];
      },
    },
    {
      id: 'lucky', name: 'Lucky', base: 0, isMeta: true,
      desc: (v, r) => {
        const vals = { common: 5, rare: 10, epic: 20, legendary: 35 };
        return '+' + vals[r.id] + '% chance to upgrade skill rarity';
      },
      apply: (s, v, r) => {
        const vals = { common: 5, rare: 10, epic: 20, legendary: 35 };
        s.luckyBonus += vals[r.id];
      },
    },
    {
      id: 'guarantee', name: 'Guarantee', base: 0, isMeta: true,
      desc: (v, r) => {
        const descs = {
          common: 'Next draw: at least one Rare skill',
          rare: 'Next draw: at least one Epic skill',
          epic: 'Next draw: at least one Legendary skill',
          legendary: 'Next draw: ALL 3 skills are Legendary',
        };
        return descs[r.id];
      },
      apply: (s, v, r) => {
        const mapping = { common: 'rare', rare: 'epic', epic: 'legendary', legendary: 'all-legendary' };
        const newG = mapping[r.id];
        // Keep the stronger guarantee
        const rank = { rare: 1, epic: 2, legendary: 3, 'all-legendary': 4 };
        if (!s.guarantee || rank[newG] > rank[s.guarantee]) {
          s.guarantee = newG;
        }
      },
    },
  ];

  // --- State ---
  let state;

  function initState() {
    return {
      dmg: 1,
      cost: 1,
      energy: 50,
      maxEnergy: 50,
      xp: 0,
      level: 1,
      xpToLevel: 100,
      wave: 1,
      enemyHp: 100,
      enemyMaxHp: 100,
      luckyBonus: 0,
      guarantee: null,
      cooldown: 1.0,
      lastClickTime: 0,
    };
  }

  // --- DOM refs ---
  const $ = id => document.getElementById(id);
  const enemyBtn   = $('enemy-btn');
  const hpFill     = $('hp-fill');
  const hpText     = $('hp-text');
  const enFill     = $('en-fill');
  const enText     = $('en-text');
  const xpFill     = $('xp-fill');
  const xpText     = $('xp-text');
  const hLevel     = $('h-level');
  const hWave      = $('h-wave');
  const hDmg       = $('h-dmg');
  const hCost      = $('h-cost');
  const modalOvl   = $('modal-overlay');
  const modalLevel = $('modal-level');
  const skillDiv   = $('skill-choices');
  const goOvl      = $('gameover-overlay');
  const goStats    = $('go-stats');
  const restartBtn = $('restart-btn');
  const guarBadge  = $('guarantee-badge');
  const hCd        = $('h-cd');
  const cdRing     = document.querySelector('#cooldown-ring circle');

  // --- Render ---
  function render() {
    const s = state;
    hpFill.style.width = (s.enemyHp / s.enemyMaxHp * 100) + '%';
    hpText.textContent = s.enemyHp + ' / ' + s.enemyMaxHp;
    enFill.style.width = (s.energy / s.maxEnergy * 100) + '%';
    enText.textContent = s.energy + ' / ' + s.maxEnergy;
    xpFill.style.width = (s.xp / s.xpToLevel * 100) + '%';
    xpText.textContent = s.xp + ' / ' + s.xpToLevel;
    hLevel.textContent = s.level;
    hWave.textContent  = s.wave;
    hDmg.textContent   = s.dmg;
    hCost.textContent  = s.cost;
    hCd.textContent    = s.cooldown.toFixed(1) + 's';

    // Guarantee badge
    guarBadge.className = '';
    if (s.guarantee) {
      const labels = {
        rare: 'Next draw: Rare+ guaranteed',
        epic: 'Next draw: Epic+ guaranteed',
        legendary: 'Next draw: Legendary guaranteed',
        'all-legendary': 'Next draw: ALL Legendary!',
      };
      const cls = s.guarantee === 'all-legendary' ? 'g-all-legendary' : 'g-' + s.guarantee;
      guarBadge.textContent = labels[s.guarantee];
      guarBadge.className = 'on ' + cls;
    }
  }

  // --- Floating damage ---
  function spawnDmgNumber(amount) {
    const el = document.createElement('span');
    el.className = 'dmg-float';
    el.textContent = '-' + amount;
    el.style.left = (30 + Math.random() * 100) + 'px';
    el.style.top  = (30 + Math.random() * 60) + 'px';
    enemyBtn.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  // --- Shake ---
  function shakeEnemy() {
    enemyBtn.classList.remove('shake');
    void enemyBtn.offsetWidth;          // reflow
    enemyBtn.classList.add('shake');
  }

  // --- Pick 3 unique skills with independent rarity rolls ---
  function pick3() {
    const pool = [...SKILLS];
    const out = [];
    const rarityIdx = { rare: 1, epic: 2, legendary: 3 };

    // Determine guarantee state
    const g = state.guarantee;
    const allLegendary = g === 'all-legendary';
    const guaranteedSlot = (!allLegendary && g) ? Math.floor(Math.random() * 3) : -1;

    // Consume guarantee
    state.guarantee = null;

    for (let slot = 0; slot < 3 && pool.length; slot++) {
      const i = Math.floor(Math.random() * pool.length);
      const skill = pool.splice(i, 1)[0];

      let minIdx = 0;
      if (allLegendary) {
        minIdx = 3; // legendary index
      } else if (slot === guaranteedSlot) {
        minIdx = rarityIdx[g] || 0;
      }

      const rarity = rollRarity(minIdx);
      const scaledVal = Math.floor((skill.base || 0) * rarity.mult);
      out.push({ skill, rarity, scaledVal });
    }
    return out;
  }

  // --- Level up modal ---
  function showLevelUp() {
    const choices = pick3();
    modalLevel.textContent = 'You reached level ' + state.level + '!';
    skillDiv.innerHTML = '';
    choices.forEach(({ skill, rarity, scaledVal }) => {
      const btn = document.createElement('button');
      btn.className = 'skill-btn rarity-' + rarity.id;
      btn.innerHTML =
        '<span class="skill-rarity">' + rarity.name + '</span>' +
        '<span class="skill-name">' + skill.name + '</span>' +
        '<span class="skill-desc">' + skill.desc(scaledVal, rarity) + '</span>';
      btn.onclick = () => {
        skill.apply(state, scaledVal, rarity);
        modalOvl.classList.remove('open');
        render();
      };
      skillDiv.appendChild(btn);
    });
    modalOvl.classList.add('open');
  }

  // --- Game over ---
  function gameOver() {
    goStats.textContent = 'Reached wave ' + state.wave + ' · Level ' + state.level;
    goOvl.classList.add('open');
  }

  // --- Cooldown ring animation ---
  const CD_CIRCUMFERENCE = 2 * Math.PI * 90; // matches SVG r=90
  function updateCooldownRing() {
    const s = state;
    const now = Date.now();
    const elapsed = now - s.lastClickTime;
    const cdMs = s.cooldown * 1000;
    const progress = Math.min(elapsed / cdMs, 1);
    cdRing.style.strokeDashoffset = CD_CIRCUMFERENCE * (1 - progress);
    if (progress >= 1) {
      enemyBtn.classList.remove('on-cooldown');
    } else {
      enemyBtn.classList.add('on-cooldown');
    }
    requestAnimationFrame(updateCooldownRing);
  }
  requestAnimationFrame(updateCooldownRing);

  // --- Click handler ---
  function onClickEnemy(ignoreCooldown = false) {
    console.log({
      ignoreCooldown,
      goOvlOpen: goOvl.classList.contains('open'),
      modalOvlOpen: modalOvl.classList.contains('open'),
      timeSinceLastClick: Date.now() - state.lastClickTime,
      cooldownMs: state.cooldown * 1000,
      wouldBlock: Date.now() - state.lastClickTime < state.cooldown * 1000
    });
    const s = state;
    if (goOvl.classList.contains('open')) return;
    if (!ignoreCooldown && modalOvl.classList.contains('open')) return;

    // Cooldown check
    if (!ignoreCooldown) {
      if (Date.now() - s.lastClickTime < s.cooldown * 1000) return;
      s.lastClickTime = Date.now();
      console.log('lastClickTime updated', s.lastClickTime, 'state.lastClickTime', state.lastClickTime);
    }

    // Spend energy
    s.energy -= s.cost;

    // Deal damage
    s.enemyHp = Math.max(0, s.enemyHp - s.dmg);
    spawnDmgNumber(s.dmg);
    shakeEnemy();

    // Check energy
    if (s.energy <= 0) {
      s.energy = 0;
      render();
      gameOver();
      return;
    }

    // XP
    s.xp += 10;
    if (s.xp >= s.xpToLevel) {
      s.xp -= s.xpToLevel;
      s.level++;
      render();
      showLevelUp();
    }

    // Enemy dead → next wave
    if (s.enemyHp <= 0) {
      s.wave++;
      s.enemyMaxHp = Math.ceil(s.enemyMaxHp * 1.5);
      s.enemyHp = s.enemyMaxHp;
    }

    render();
  }

  // --- Restart ---
  function restart() {
    goOvl.classList.remove('open');
    modalOvl.classList.remove('open');
    state = initState();
    render();
  }

  // --- Debug mode (Shift + hover) ---
  let debugInterval = null;
  let shiftHeld = false;
  let hovering = false;
  const debugBadge = $('debug-badge');

  function updateDebug() {
    const shouldRun = shiftHeld && hovering;
    if (shouldRun && !debugInterval) {
      debugBadge.classList.add('on');
      debugInterval = setInterval(() => onClickEnemy(true), 100);
    } else if (!shouldRun && debugInterval) {
      clearInterval(debugInterval);
      debugInterval = null;
      debugBadge.classList.remove('on');
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Shift' && !shiftHeld) { shiftHeld = true; updateDebug(); }
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'Shift') { shiftHeld = false; updateDebug(); }
  });
  enemyBtn.addEventListener('mouseenter', () => { hovering = true; updateDebug(); });
  enemyBtn.addEventListener('mouseleave', () => { hovering = false; updateDebug(); });

  // --- Init ---
  enemyBtn.addEventListener('click', () => onClickEnemy(false));
  restartBtn.addEventListener('click', restart);
  state = initState();
  render();
</script>
</body>
</html>
